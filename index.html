<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Chatbot Assistant</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/5f59ca6ad3.js" crossorigin="anonymous"></script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caveat:wght@400;700&family=Lobster&family=Monoton&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display+SC:ital,wght@0,400;0,700;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+Pro:ital,wght@0,400;0,700;1,700&family=Work+Sans:ital,wght@0,400;0,700;1,700&display=swap");

        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #e57742;
            --light-bg: #f5f7fa;
            --user-msg-bg: #e3f2fd;
            --bot-msg-bg: #ffebee;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: "Roboto", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .chatbot-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .chatbot-header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }

        .chatbot-heading {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .chatbot-subheading {
            font-size: 14px;
            opacity: 0.8;
            margin: 5px 0 0;
        }

        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--light-bg);
            display: flex;
            flex-direction: column;
        }

        .bot-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .msg-container {
            display: flex;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        .msg-from-chatbot-container {
            align-self: flex-start;
        }

        .msg-to-chatbot-container {
            align-self: flex-end;
        }

        .msg-from-chatbot,
        .msg-to-chatbot {
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 70%;
            box-shadow: var(--shadow);
            position: relative;
            word-wrap: break-word;
        }

        .msg-from-chatbot {
            background-color: var(--bot-msg-bg);
            color: #333;
            border-bottom-left-radius: 5px;
        }

        .msg-to-chatbot {
            background-color: var(--user-msg-bg);
            color: #333;
            border-bottom-right-radius: 5px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #aaa;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {

            0%,
            80%,
            100% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-area {
            padding: 20px;
            background-color: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
        }

        .user-input {
            flex: 1;
            padding: 15px 20px;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .user-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74, 111, 165, 0.2);
        }

        .send-msg-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-msg-btn:hover {
            background-color: #3a5a8a;
            transform: scale(1.05);
        }

        .send-msg-btn:active {
            transform: scale(0.95);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .suggestion-chip {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .welcome-msg {
            text-align: center;
            color: #666;
            margin: 20px 0;
            font-style: italic;
        }

        /* Responsive adjustments */
        @media (max-width: 576px) {
            .chatbot-container {
                height: 90vh;
                border-radius: 10px;
            }

            .chatbot-header {
                padding: 15px;
            }

            .chatbot-heading {
                font-size: 22px;
            }

            .msg-from-chatbot,
            .msg-to-chatbot {
                max-width: 85%;
            }

            .bot-avatar,
            .user-avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="chatbot-container">
        <div class="chatbot-header">
            <h1 class="chatbot-heading">Meet our Chatbot</h1>
            <p class="chatbot-subheading">Your personal assistant is here to help</p>
        </div>

        <div id="chatContainer" class="chat-area">
            <div class="welcome-msg">
                <p>Hello! I'm your assistant. How can I help you today?</p>
            </div>

            <div class="suggestions">
                <div class="suggestion-chip" onclick="sendSuggestion('Hi')">Say Hi</div>
                <div class="suggestion-chip" onclick="sendSuggestion('What can you do?')">What can you do?</div>
                <div class="suggestion-chip" onclick="sendSuggestion('Tell me a joke')">Tell me a joke</div>
                <div class="suggestion-chip" onclick="sendSuggestion('Help')">Help</div>
            </div>
        </div>

        <div class="input-area">
            <input class="user-input" id="userInput" placeholder="Type your message here..." onkeypress="handleKeyPress(event)" />
            <button class="send-msg-btn" id="sendMsgBtn" onclick="sendMsgToChatbot()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        let chatbotMsgList = [
            "Hi there! How can I assist you today?",
            "Hello! Nice to meet you.",
            "Good morning! What can I do for you?",
            "Good evening! How can I help?",
            "I'm here to answer your questions. What would you like to know?",
            "Thank you for reaching out!",
            "I'm doing well, thanks for asking!",
            "That's an interesting question. Let me think...",
            "I'm afraid I don't have an answer for that right now.",
            "Is there anything else I can help with?",
            "Sure, I'd be happy to help with that!",
            "Let me check that for you...",
            "I understand what you're asking.",
            "That's a great question!",
            "I'm here to make your day easier!"
        ];

        // Extended responses for specific user inputs
        const chatbotResponses = {
            "hi": ["Hi there!", "Hello!", "Hey! How can I help you?"],
            "hello": ["Hi there!", "Hello!", "Hey! How can I help you?"],
            "how are you": ["I'm doing great, thanks for asking!", "I'm just a bot, but I'm functioning well!", "All systems are go! How are you?"],
            "what can you do": ["I can chat with you, answer simple questions, and keep you company!", "I'm here to have conversations and assist with basic queries.", "I'm a friendly chatbot designed to make your day better!"],
            "help": ["I'm here to help! You can ask me questions or just chat with me.", "How can I assist you? Try asking me something or use the suggestion chips above."],
            "thank you": ["You're welcome!", "My pleasure!", "Happy to help!"],
            "joke": ["Why don't scientists trust atoms? Because they make up everything!", "What do you call a fake noodle? An impasta!", "Why did the scarecrow win an award? Because he was outstanding in his field!"],
            "bye": ["Goodbye! Have a great day!", "See you later!", "Bye! Come back anytime!"]
        };

        let chatContainerEl = document.getElementById("chatContainer");
        let userInputEl = document.getElementById("userInput");

        function sendMsgToChatbot() {
            let userMsg = userInputEl.value.trim();

            if (userMsg === "") return;

            // Add user message to chat
            addMessageToChat(userMsg, "user");

            // Clear input
            userInputEl.value = "";

            // Show typing indicator
            showTypingIndicator();

            // Get reply after a short delay to simulate thinking
            setTimeout(getReplyFromChatbot, 1000 + Math.random() * 1000);
        }

        function sendSuggestion(text) {
            userInputEl.value = text;
            sendMsgToChatbot();
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMsgToChatbot();
            }
        }

        function addMessageToChat(message, sender) {
            let msgContainerEl = document.createElement("div");
            msgContainerEl.classList.add("msg-container");

            if (sender === "user") {
                msgContainerEl.classList.add("msg-to-chatbot-container");

                let userMsgEl = document.createElement("div");
                userMsgEl.textContent = message;
                userMsgEl.classList.add("msg-to-chatbot");
                msgContainerEl.appendChild(userMsgEl);

                let avatarEl = document.createElement("div");
                avatarEl.classList.add("user-avatar");
                avatarEl.innerHTML = '<i class="fas fa-user"></i>';
                msgContainerEl.appendChild(avatarEl);
            } else {
                msgContainerEl.classList.add("msg-from-chatbot-container");

                let avatarEl = document.createElement("div");
                avatarEl.classList.add("bot-avatar");
                avatarEl.innerHTML = '<i class="fas fa-robot"></i>';
                msgContainerEl.appendChild(avatarEl);

                let botMsgEl = document.createElement("div");
                botMsgEl.textContent = message;
                botMsgEl.classList.add("msg-from-chatbot");
                msgContainerEl.appendChild(botMsgEl);
            }

            chatContainerEl.appendChild(msgContainerEl);
            scrollToBottom();
        }

        function showTypingIndicator() {
            let typingContainer = document.createElement("div");
            typingContainer.classList.add("typing-indicator");
            typingContainer.id = "typingIndicator";

            let avatarEl = document.createElement("div");
            avatarEl.classList.add("bot-avatar");
            avatarEl.innerHTML = '<i class="fas fa-robot"></i>';
            typingContainer.appendChild(avatarEl);

            let dotsContainer = document.createElement("div");
            dotsContainer.style.display = "flex";
            dotsContainer.style.alignItems = "center";
            dotsContainer.style.marginLeft = "10px";

            for (let i = 0; i < 3; i++) {
                let dot = document.createElement("div");
                dot.classList.add("typing-dot");
                dotsContainer.appendChild(dot);
            }

            typingContainer.appendChild(dotsContainer);
            chatContainerEl.appendChild(typingContainer);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            let typingIndicator = document.getElementById("typingIndicator");
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        function getReplyFromChatbot() {
            removeTypingIndicator();

            // Get the last user message
            let userMessages = document.querySelectorAll('.msg-to-chatbot');
            let lastUserMessage = userMessages[userMessages.length - 1].textContent.toLowerCase();

            let chatbotMsg;

            // Check if we have a specific response for this message
            let foundResponse = false;
            for (const [key, responses] of Object.entries(chatbotResponses)) {
                if (lastUserMessage.includes(key)) {
                    chatbotMsg = responses[Math.floor(Math.random() * responses.length)];
                    foundResponse = true;
                    break;
                }
            }

            // If no specific response found, use the generic message list
            if (!foundResponse) {
                let noOfChatbotMsgs = chatbotMsgList.length;
                chatbotMsg = chatbotMsgList[Math.floor(Math.random() * noOfChatbotMsgs)];
            }

            addMessageToChat(chatbotMsg, "bot");
        }

        function scrollToBottom() {
            chatContainerEl.scrollTop = chatContainerEl.scrollHeight;
        }

        // Initialize with a welcome message from the bot after a short delay
        setTimeout(() => {
            addMessageToChat("Hello! I'm your friendly chatbot assistant. How can I help you today?", "bot");
        }, 500);
    </script>
</body>

</html>
